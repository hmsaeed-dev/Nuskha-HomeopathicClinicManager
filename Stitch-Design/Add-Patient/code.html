  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface font-body antialiased">

  <!-- Background Workspace Silhouette -->
  <div class="min-h-[1024px] flex flex-col bg-light-surface pointer-events-none select-none" aria-hidden="true" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <div class="mx-gutter-lg mt-gutter-md h-14 rounded-lg bg-light-surface-container-lowest"></div>
    <div class="flex-1 p-gutter-lg grid grid-cols-12 gap-gutter-lg">
      <div class="col-span-3 rounded-xl bg-light-surface-container-low"></div>
      <div class="col-span-4 rounded-xl bg-light-surface-container-lowest"></div>
      <div class="col-span-5 rounded-xl bg-light-surface-container-lowest"></div>
    </div>
  </div>

  <!-- Right-Anchored Floating Slide-Over Drawer -->
  <div class="fixed inset-0 z-50 flex justify-end p-gutter-lg bg-light-inverse-surface/55 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <aside class="w-full max-w-lg rounded-xl bg-light-surface-container-lowest shadow-2xl flex flex-col overflow-hidden">

      <!-- Drawer Header: Live Token + Monogram -->
      <header class="px-gutter-xl py-gutter-lg bg-light-surface-container-low flex items-center justify-between gap-gutter-md">
        <div class="flex items-center gap-gutter-md">
          <div class="w-11 h-11 rounded-full bg-light-primary text-light-on-primary flex items-center justify-center font-headline text-headline-sm shadow-sm shrink-0">MT</div>
          <div class="flex flex-col">
            <div class="flex items-center gap-gutter-sm">
              <h1 id="drawer-title" class="font-headline text-headline-md text-light-on-surface" data-design-text-token="headline-md">New Walk-in</h1>
              <span class="px-gutter-sm py-gutter-xs rounded-full bg-light-secondary-container text-light-on-secondary-container font-mono text-mono-sm tabular-nums">#T-049</span>
            </div>
            <span class="font-mono text-mono-sm text-light-on-surface-variant tabular-nums" data-design-text-token="mono-sm">ID: NK-1492 · Queue #4</span>
          </div>
        </div>

        <a href="../opd-workspace/ActiveOPDConsultationWorkspace.html" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" aria-label="Close drawer" class="inline-flex items-center justify-center w-9 h-9 rounded-full text-light-on-secondary-container hover:bg-light-surface-container transition-colors duration-state-change">
          <span class="material-symbols-outlined text-headline-md" aria-hidden="true">close</span>
        </a>
      </header>

      <!-- Compact Single-Column Fast-Entry Form -->
      <form class="flex-1 overflow-y-auto p-gutter-xl flex flex-col gap-gutter-lg">

        <!-- Name + Phone -->
        <div class="grid grid-cols-12 gap-gutter-md">
          <label class="col-span-7 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Patient Name</span>
            <input type="text" value="Muhammad Tariq" class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 text-light-on-surface font-body text-body-md focus:ring-2 focus:ring-light-primary">
          </label>
          <label class="col-span-5 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Phone</span>
            <input type="tel" value="0300-8841290" class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 font-mono text-mono-md text-light-on-surface tabular-nums focus:ring-2 focus:ring-light-primary">
          </label>
        </div>

        <!-- Relation + Guardian -->
        <div class="grid grid-cols-12 gap-gutter-md">
          <label class="col-span-4 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Relation</span>
            <select class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-2 focus:ring-light-primary">
              <option selected value="s/o">s/o</option>
              <option value="w/o">w/o</option>
              <option value="d/o">d/o</option>
            </select>
          </label>
          <label class="col-span-8 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Guardian / Spouse</span>
            <input type="text" value="Abdul Rehman" class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-2 focus:ring-light-primary">
          </label>
        </div>

        <!-- Age + Gender Tiles -->
        <div class="grid grid-cols-12 gap-gutter-md items-end">
          <label class="col-span-4 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Age</span>
            <input type="text" value="34 yrs" class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-2 focus:ring-light-primary">
          </label>
          <div class="col-span-8 flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Gender</span>
            <div class="grid grid-cols-3 gap-gutter-xs bg-light-surface-container-low p-gutter-xs rounded-md">
              <button type="button" class="py-gutter-xs rounded-sm bg-light-primary text-light-on-primary shadow-sm flex items-center justify-center gap-gutter-xs font-body text-label-sm">
                <span class="material-symbols-outlined text-body-md" aria-hidden="true">male</span>
                <span>Male</span>
              </button>
              <button type="button" class="py-gutter-xs rounded-sm text-light-on-surface-variant flex items-center justify-center gap-gutter-xs font-body text-label-sm">
                <span class="material-symbols-outlined text-body-md" aria-hidden="true">female</span>
                <span>Female</span>
              </button>
              <button type="button" class="py-gutter-xs rounded-sm text-light-on-surface-variant flex items-center justify-center gap-gutter-xs font-body text-label-sm">
                <span class="material-symbols-outlined text-body-md" aria-hidden="true">child_care</span>
                <span>Child</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Mohalla / Locality with 1-Tap Neighborhood Presets -->
        <div class="flex flex-col gap-gutter-sm">
          <label for="drawer-locality" class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Mohalla / Locality</label>
          <input id="drawer-locality" type="text" value="Mohallah Farooqia, Taxila" class="w-full px-gutter-md py-gutter-sm rounded-md bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-2 focus:ring-light-primary">
          <div class="flex flex-wrap gap-gutter-xs">
            <button type="button" class="px-gutter-sm py-gutter-xs rounded-full bg-light-secondary-container text-light-on-secondary-container font-body text-label-sm">Farooqia</button>
            <button type="button" class="px-gutter-sm py-gutter-xs rounded-full bg-light-surface-container-low text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-sm">Taxila Cantt</button>
            <button type="button" class="px-gutter-sm py-gutter-xs rounded-full bg-light-surface-container-low text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-sm">Lala Rukh</button>
            <button type="button" class="px-gutter-sm py-gutter-xs rounded-full bg-light-surface-container-low text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-sm">Wah Model</button>
          </div>
        </div>

        <!-- 1-Tap Fee Tiers -->
        <div class="flex flex-col gap-gutter-sm">
          <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Consultation Fee</span>
          <div class="grid grid-cols-4 gap-gutter-xs bg-light-surface-container-low p-gutter-xs rounded-lg">
            <button type="button" class="py-gutter-sm rounded-md bg-light-primary text-light-on-primary shadow-sm font-mono text-mono-sm tabular-nums">Rs. 500</button>
            <button type="button" class="py-gutter-sm rounded-md text-light-on-surface-variant hover:bg-light-surface-container font-mono text-mono-sm tabular-nums">Rs. 300</button>
            <button type="button" class="py-gutter-sm rounded-md text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-sm">Free</button>
            <button type="button" class="py-gutter-sm rounded-md text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-sm">Due</button>
          </div>
        </div>
      </form>

      <!-- Sticky Drawer Footer -->
      <footer class="px-gutter-xl py-gutter-lg bg-light-surface-container-low flex items-center justify-between gap-gutter-md">
        <a href="../opd-workspace/ActiveOPDConsultationWorkspace.html" class="px-gutter-md py-gutter-sm rounded-full text-light-on-surface-variant hover:bg-light-surface-container font-body text-label-lg whitespace-nowrap transition-colors duration-state-change">
          Cancel
        </a>
        <a href="../opd-workspace/ActiveOPDConsultationWorkspace.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center gap-gutter-sm px-gutter-xl py-gutter-sm rounded-full bg-light-primary text-light-on-primary hover:bg-light-primary-container shadow-sm transition-colors duration-state-change whitespace-nowrap">
          <span class="material-symbols-outlined text-body-lg" aria-hidden="true">person_add</span>
          <span class="font-body text-label-lg" data-design-text-token="label-lg">Add to Queue</span>
        </a>
      </footer>
    </aside>
  </div>



</body></html>
